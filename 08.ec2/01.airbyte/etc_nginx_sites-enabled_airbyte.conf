server {
    server_name airbytes.gustavolens.com; # managed by Certbot

    client_max_body_size 200M;  # required for Airbyte API

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;  # if you use Airbyte's basic auth
      proxy_read_timeout 3600;  # set a number in seconds suitable for you
      proxy_pass  http://localhost:8000;
    }


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/airbytes.gustavolens.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/airbytes.gustavolens.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = airbytes.gustavolens.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    listen [::]:80 ;
    server_name airbytes.gustavolens.com;
    return 404; # managed by Certbot
}